title: Focal Support
description: Installation and usage guides for Focal patio heaters.

# Used by the print fallback in _includes/video.html and feedback.html to
# build absolute links. Update this if the production domain changes.
url: "https://support.focalheat.co"

# GitHub Pages serves from a subpath like /repo-name/. Empty because the
# custom domain serves from the root.
baseurl: ""

collections:
  guides:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: guides
    values:
      layout: guide

# Only what GitHub Pages' Jekyll needs.
markdown: kramdown