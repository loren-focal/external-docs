title: Focal Support
description: Installation and usage guides for Focal patio heaters.

# Used by the print fallback in _includes/video.html and feedback.html to
# build absolute links. Update this if the production domain changes.
url: "https://support.focalheat.co"

# This repo serves from GitHub Pages at /external-docs/ (loren-focal.github.io),
# used for testing/staging. The production repo (BeamT/external-docs, served at
# support.focalheat.co) sets this differently — don't copy this value over.
baseurl: "/external-docs"

collections:
  guides:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: guides
    values:
      layout: guide

# Only what GitHub Pages' Jekyll needs.
markdown: kramdown